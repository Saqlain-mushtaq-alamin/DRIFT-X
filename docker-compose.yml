version: '3.8'

services:
  driftx-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=mlruns

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns
