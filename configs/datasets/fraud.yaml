# IEEE-CIS Fraud Detection Dataset Configuration
# PROVENANCE: Conditionally REAL or SYNTHETIC.
#   - If data/raw/train_transaction.csv exists (Kaggle download): REAL data
#   - If not: falls back to generate_synthetic_drift_data() — SYNTHETIC
# The fallback is the common case.  Set data_source_type accordingly and
# label tables clearly to distinguish the two cases.
dataset: "fraud"
name: "IEEE-CIS Fraud (Synthetic Fallback)"
timestamp_col: "TransactionDT"
target_col: "isFraud"
window_size: "monthly"
min_window_samples: 1000
data_path: "data/raw/train_transaction.csv"
# Override to 'real' only if data/raw/train_transaction.csv is the Kaggle download
data_source_type: "synthetic"
