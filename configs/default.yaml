# DRIFT-X Default Experiment Configuration

project:
  name: "driftx"
  seed: 42
  n_seeds: 5                    # Number of random seeds for experiments

data:
  dataset: "fraud"              # Options: fraud, intrusion, healthcare, electricity
  timestamp_col: "TransactionDT" # Varies per dataset
  target_col: "isFraud"
  window_size: "monthly"        # Options: weekly, monthly, quarterly
  min_window_samples: 1000      # Skip windows with fewer samples
  # Provenance field: "real" for actual datasets (ELEC2), "synthetic" for generated
  # streams.  Always set this to "synthetic" unless you are using the true ELEC2
  # OpenML download.  This field propagates to every result row so downstream
  # analysis can filter by data provenance.
  data_source_type: "synthetic"  # IMPORTANT: fraud & intrusion streams are SYNTHETIC

model:
  type: "xgboost"               # Options: xgboost, random_forest, gradient_boosting
  params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    eval_metric: "logloss"
    use_label_encoder: false

detection:
  statistical_method: "ks"      # Options: ks, psi
  ks_alpha: 0.05                # Significance level for KS-test
  psi_threshold: 0.2            # PSI threshold for drift

explainability:
  shap_method: "tree"           # Options: tree, kernel, sampling
  max_shap_samples: 500         # Subsample for SHAP computation speed
  # NOTE: these thresholds were originally derived from percentiles of observed
  # in-sample scores on the same streams used for evaluation.  They must be
  # re-tuned on held-out / separate streams before being used for honest reporting.
  magnitude_threshold: 0.030     # P3 threshold (requires independent tuning validation)
  rank_change_threshold: 0.035   # P4 threshold (requires independent tuning validation)

fusion:
  alpha: 0.4                    # Weight for statistical drift
  beta: 0.4                     # Weight for SHAP magnitude
  gamma: 0.2                    # Weight for SHAP rank-change
  use_calibrated_zscore: true   # Calibrate DIS components into noise z-score units
  clip_max: 5.0                 # Clip unbounded z-scores to prevent single-channel dominance
  gating_mode: "two_channel"    # Options: "two_channel", "stat_and_shap", "min", "none"
  gating_channel_threshold: 2.5 # Z-score threshold for individual channel activation
  gating_min_channels: 2        # Number of channels required to agree before retraining
  threshold_mode: "fixed"       # Options: "fixed" (noise units ~3.0) or "adaptive"
  fixed_threshold: 3.0          # Fixed threshold in calibrated noise units
  warmup_threshold: .inf        # Never retrain during warmup
  adaptive_lookback: 10         # k: number of past windows for adaptive threshold
  adaptive_lambda: 1.92         # lambda: sensitivity for ~5% false alarms (t_0.95,9 * sqrt(1.1))

policy:
  fixed_schedule_interval: 3    # Retrain every N windows for P1
  active_policies:              # Which policies to run
    - "p0_never"
    - "p1_fixed"
    - "p2_drift_only"
    - "p3_shap_magnitude"
    - "p4_shap_rank"
    - "p5_dis_fused"

evaluation:
  metrics:
    - "accuracy"
    - "f1_weighted"
    - "precision_weighted"
    - "recall_weighted"
  # Primary cost metric is retrain_count (count of retrains, timing-noise-free).
  # wall_clock_seconds is recorded but should not be used as the primary cost
  # comparator because training time varies with model version, data order, and
  # OS scheduling noise.
  cost_metric: "retrain_count"  # primary: count; secondary: wall_clock_seconds

mlflow:
  tracking_uri: "mlruns"        # Local MLflow directory
  experiment_name: "driftx_main"

output:
  results_dir: "results"
  save_plots: true
  save_csv: true
  plot_format: "png"            # Options: png, svg, pdf
